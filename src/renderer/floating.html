<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RookieDSH Actions</title>
    <style>
      :root {
        --accent: #4f8cff;
        --panel: #26272e;
        --border: #3a3b42;
        --text: #d8d9de;
        --muted: #8b8c95;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { color: var(--text); font: 14px 'Segoe UI', system-ui, sans-serif; }
      #fab {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 48px;
        height: 48px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--accent);
        color: white;
        cursor: grab;
        font-size: 25px;
        line-height: 1;
        box-shadow: none;
        touch-action: none;
      }
      body.panel-open #fab { right: 16px; bottom: 16px; }
      #fab:hover { background: #3f78df; }
      #fab:active { cursor: grabbing; }
      #panel {
        position: absolute;
        inset: 0;
        width: 100%;
        min-height: 100%;
        padding: 24px 20px;
        border-left: 1px solid var(--border);
        background: var(--panel);
        box-shadow: none;
      }
      #panel p { margin: 8px 0 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <section id="panel" hidden role="dialog" aria-label="Settings panel">
      <strong>Settings</strong>
      <p id="runtime-config">Loading runtime configuration…</p>
    </section>
    <button id="fab" type="button" aria-label="Open settings panel">⚙</button>
    <script>
      const STORAGE_KEY = 'rookiedsh.floatingActionButton.position';
      const shell = window.rookiedsh.shell;
      const fab = document.getElementById('fab');
      const panel = document.getElementById('panel');
      const runtimeConfig = document.getElementById('runtime-config');
      let panelOpen = false;
      let drag = null;
      let moved = false;

      function savePosition(next) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch { /* best effort */ }
      }

      function closePanel() {
        panelOpen = false;
        panel.hidden = true;
        document.body.classList.remove('panel-open');
        shell.setFloatingPanelOpen(false);
      }

      function togglePanel() {
        panelOpen = !panelOpen;
        panel.hidden = !panelOpen;
        document.body.classList.toggle('panel-open', panelOpen);
        shell.setFloatingPanelOpen(panelOpen);
      }

      function beginDrag(event) {
        if (panelOpen) closePanel();
        fab.setPointerCapture(event.pointerId);
        drag = { pointerId: event.pointerId, lastX: event.clientX, lastY: event.clientY };
        moved = false;
      }

      function moveDrag(event) {
        if (!drag || drag.pointerId !== event.pointerId) return;
        const deltaX = event.clientX - drag.lastX;
        const deltaY = event.clientY - drag.lastY;
        drag.lastX = event.clientX;
        drag.lastY = event.clientY;
        if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) moved = true;
        if (!moved) return;
        if (!drag.started) {
          drag.started = true;
          shell.beginFloatingDrag();
        }
      }

      function endDrag(event) {
        if (!drag || drag.pointerId !== event.pointerId) return;
        if (fab.hasPointerCapture(event.pointerId)) fab.releasePointerCapture(event.pointerId);
        drag = null;
        if (moved) {
          shell.endFloatingDrag();
          shell.getFloatingPosition().then(savePosition).catch(() => {});
        } else {
          togglePanel();
        }
      }

      fab.addEventListener('pointerdown', beginDrag);
      fab.addEventListener('pointermove', moveDrag);
      fab.addEventListener('pointerup', endDrag);
      fab.addEventListener('pointercancel', endDrag);
      fab.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          togglePanel();
        }
      });

      window.rookiedsh.config.get().then((config) => {
        runtimeConfig.textContent = `Harness Port: ${config.runtime.port} · Command: ${config.runtime.command}`;
      }).catch(() => {
        runtimeConfig.textContent = 'Runtime configuration unavailable.';
      });

      (async () => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (saved && Number.isFinite(saved.right) && Number.isFinite(saved.bottom)) {
            shell.setFloatingPosition(saved);
          } else {
            savePosition(await shell.getFloatingPosition());
          }
        } catch {
          // Keep the main-process default position.
        }
      })();
    </script>
  </body>
</html>
